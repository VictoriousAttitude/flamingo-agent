name: Soak

# A long run of the real agent on both operating systems, checked for cadence, child
# outcomes and resident-memory growth by scripts/soak_check.py. Started by hand (the
# Actions tab or `gh workflow run soak.yml -f minutes=30`) so the regular CI stays fast.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to let the agent run
        required: true
        default: "10"

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux soak (interactive under sudo)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent-rust
      - name: Build the agent (release)
        working-directory: agent-rust
        run: cargo build --release
      - name: Build logger-child
        run: |
          cmake -S logger-child -B logger-child/build -DCMAKE_BUILD_TYPE=Release
          cmake --build logger-child/build
      # Period 2 s (child timeout 1 s) gives thirty cycles a minute; the agent runs as root,
      # as it would in production, and is stopped with SIGINT like a Ctrl-C.
      - name: Run the agent for ${{ inputs.minutes }} minutes
        run: |
          LOGS="$RUNNER_TEMP/soak-logs"
          sudo ./agent-rust/target/release/flamingo-agent \
            --log-dir "$LOGS" \
            --child-path "$PWD/logger-child/build/logger-child" \
            --period-secs 2 --child-timeout-secs 1 \
            > "$RUNNER_TEMP/agent-stderr.txt" 2>&1 &
          sleep "$(( ${{ inputs.minutes }} * 60 ))"
          sudo pkill -INT -x flamingo-agent
          for _ in $(seq 1 30); do pgrep -x flamingo-agent > /dev/null || break; sleep 1; done
          if pgrep -x flamingo-agent; then echo "agent did not stop"; exit 1; fi
          if pgrep -x logger-child; then echo "orphan logger-child"; exit 1; fi
          sudo chown -R "$(id -u):$(id -g)" "$LOGS"
          tail -n 4 "$LOGS/agent.log"
      - name: Check the soak
        run: |
          python3 scripts/soak_check.py \
            --agent-log "$RUNNER_TEMP/soak-logs/agent.log" \
            --child-log "$RUNNER_TEMP/soak-logs/child.log" \
            --minutes "${{ inputs.minutes }}" --period-secs 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: soak-logs-linux
          path: ${{ runner.temp }}/soak-logs

  windows:
    name: Windows soak (installed service)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent-rust
      - name: Install via install.ps1
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\install.ps1
      # The service runs at its registered cadence (5 s); the run is bounded by the input.
      - name: Let the service run for ${{ inputs.minutes }} minutes
        shell: pwsh
        run: |
          Start-Sleep -Seconds ([int]"${{ inputs.minutes }}" * 60)
          $q = sc.exe query FlamingoAgent | Out-String
          Write-Host $q
          if ($q -notmatch 'RUNNING') { throw "service is not RUNNING after the soak: $q" }
          Stop-Service FlamingoAgent
          if (Get-Process logger-child -ErrorAction SilentlyContinue) { throw 'orphan logger-child' }
          Get-Content "$env:ProgramData\FlamingoAgent\agent.log" -Tail 4
      - name: Check the soak
        shell: pwsh
        run: |
          python scripts/soak_check.py `
            --agent-log "$env:ProgramData\FlamingoAgent\agent.log" `
            --child-log "$env:ProgramData\FlamingoAgent\child.log" `
            --minutes "${{ inputs.minutes }}" --period-secs 5
          if ($LASTEXITCODE -ne 0) { throw "soak checks failed" }
      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          & "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe" --uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall exit $LASTEXITCODE" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: soak-logs-windows
          path: C:\ProgramData\FlamingoAgent\*.log
