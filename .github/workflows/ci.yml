name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (test + cross-check Windows)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt, llvm-tools-preview
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent-rust
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs (warnings denied)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-deny,cargo-audit
      # Policy in agent-rust/deny.toml: known vulnerabilities and yanked crates fail the build,
      # every license must be on the explicit allow-list, and only crates.io is a valid source.
      - name: Supply chain (cargo deny)
        run: cargo deny check
      - name: Supply chain (cargo audit)
        run: cargo audit
      - name: Test
        run: cargo test
      # Runs before the coverage steps so the instrumented run is untouched by root.
      # `sudo -E` keeps the environment but resets PATH, and rustup's shims need their two
      # home directories, so all three are passed explicitly with the defaults rustup uses.
      - name: Privileged Linux tests
        run: |
          sudo -E env "PATH=$PATH" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            cargo test --test privileged_linux -- --ignored --nocapture
      # Always runs, even if the privileged tests above fail, so `target/` is handed back to
      # the runner user before anything else writes to it.
      - name: Restore target ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage (lcov)
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - name: Coverage (line)
        run: cargo llvm-cov report --summary-only --fail-under-lines 89
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: agent-rust/lcov.info
      - name: Compile-check every Windows code path
        run: cargo check --target x86_64-pc-windows-gnu --all-targets
      - name: Configure logger-child
        working-directory: ${{ github.workspace }}
        run: cmake -S logger-child -B logger-child/build -DCMAKE_BUILD_TYPE=Release
      - name: Build logger-child
        working-directory: ${{ github.workspace }}
        run: cmake --build logger-child/build
      - name: Test logger-child
        working-directory: ${{ github.workspace }}
        run: ctest --test-dir logger-child/build --output-on-failure

  mutants:
    name: Mutation testing (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent-rust
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-mutants
      # Every mutant of the portable and Unix code must be killed by the unprivileged tiers;
      # the policy in agent-rust/.cargo/mutants.toml lists the exclusions and why.
      - name: cargo mutants
        run: cargo mutants -j 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutants-report
          path: agent-rust/mutants.out

  windows:
    name: Windows (MSVC, static CRT)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent-rust
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov
      # The Windows-only code (DACLs, job objects, elevation, the SCM wrapper) is invisible to
      # the Linux figure; this one measures it on the platform that ships.
      - name: Coverage (lcov)
        run: cargo llvm-cov --all-targets --lcov --output-path lcov-windows.info
      - name: Coverage (line)
        run: cargo llvm-cov report --summary-only --fail-under-lines 75
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov-windows
          path: agent-rust/lcov-windows.info
      - name: Configure logger-child
        working-directory: ${{ github.workspace }}
        run: cmake -S logger-child -B logger-child/build -A x64
      - name: Build logger-child
        working-directory: ${{ github.workspace }}
        run: cmake --build logger-child/build --config Release
      - name: Test logger-child
        working-directory: ${{ github.workspace }}
        run: ctest --test-dir logger-child/build -C Release --output-on-failure

  mutants-windows:
    name: Mutation testing (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: agent-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent-rust
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-mutants
      # The Windows-only sources, mutated on the platform that runs their tests; the policy
      # in agent-rust/.cargo/mutants-windows.toml names the functions only the end-to-end
      # job can exercise. Every other surviving mutant fails the build.
      - name: cargo mutants (Windows-only sources)
        run: cargo mutants -j 2 --config .cargo/mutants-windows.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutants-report-windows
          path: agent-rust/mutants.out

  windows-service:
    name: Windows service end-to-end
    runs-on: windows-latest
    needs: [windows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent-rust
      - name: Install via install.ps1
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\install.ps1
      - name: Service configuration and state
        shell: pwsh
        run: |
          $qc = sc.exe qc FlamingoAgent | Out-String
          Write-Host $qc
          if ($qc -notmatch 'AUTO_START') { throw 'not AUTO_START' }
          if ($qc -notmatch 'LocalSystem') { throw 'not LocalSystem' }
          $q = sc.exe query FlamingoAgent | Out-String
          if ($q -notmatch 'RUNNING') { throw "not RUNNING: $q" }
      # Recovery: the SCM must be configured to restart the service after a failure, twice,
      # five seconds apart, with a one-day reset of the attempt counter, and to treat a
      # non-zero exit like a crash.
      - name: Recovery configuration
        shell: pwsh
        run: |
          $qf = sc.exe qfailure FlamingoAgent | Out-String
          Write-Host $qf
          if ($qf -notmatch 'RESET_PERIOD \(in seconds\)\s*:\s*86400') { throw 'reset period is not one day' }
          $restarts = ([regex]::Matches($qf, 'RESTART -- Delay = 5000 milliseconds')).Count
          if ($restarts -ne 2) { throw "expected 2 restart actions with a 5 s delay, found $restarts" }
          $flag = sc.exe qfailureflag FlamingoAgent | Out-String
          Write-Host $flag
          if ($flag -notmatch 'FAILURE_ACTIONS_ON_NONCRASH_FAILURES\s*:\s*TRUE') { throw 'non-crash failures are not covered' }
      # The start must be in the Application event log, rendered as plain text through the
      # message table embedded in the agent's own executable (registered at install time),
      # and the registration must be exactly what --install wrote.
      - name: Event log records the start
        shell: pwsh
        run: |
          # Read the stored value unexpanded: Get-ItemProperty would expand %SystemRoot%.
          $key = Get-Item 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\FlamingoAgent'
          $file = $key.GetValue('EventMessageFile', $null, 'DoNotExpandEnvironmentNames')
          $types = $key.GetValue('TypesSupported')
          Write-Host "EventMessageFile = $file (kind $($key.GetValueKind('EventMessageFile'))); TypesSupported = $types"
          if ($file -ne "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe" -or $types -ne 7) { throw 'unexpected event source registration' }
          if ($key.GetValueKind('EventMessageFile') -ne 'ExpandString') { throw 'EventMessageFile is not REG_EXPAND_SZ' }
          $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='FlamingoAgent'; Id=1} -MaxEvents 1
          Write-Host "$($ev.TimeCreated) [$($ev.Id)] $($ev.LevelDisplayName): $($ev.Message)"
          if ($ev.LevelDisplayName -ne 'Information') { throw "expected an Information event, got $($ev.LevelDisplayName)" }
          if ($ev.Message -notmatch 'Flamingo Agent started; details are logged to C:\\ProgramData\\FlamingoAgent\\agent\.log') { throw 'unexpected start message' }
          if ($ev.Message -match 'cannot be found') { throw 'the message file registration did not take effect' }
      - name: Let it run three cycles
        shell: pwsh
        run: Start-Sleep -Seconds 12
      - name: Logs and ACL
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramData 'FlamingoAgent'
          Get-Content "$dir\agent.log" | Select-Object -Last 12
          $childLines = @(Get-Content "$dir\child.log")
          Write-Host "child.log lines: $($childLines.Count)"
          if ($childLines.Count -lt 2) { throw 'child.log has fewer than 2 lines' }
          if ($childLines[-1] -notmatch 'elevated=true$') { throw "last child line: $($childLines[-1])" }
          $acl = icacls "$dir\child.log" | Out-String
          Write-Host $acl
          if ($acl -notmatch 'BUILTIN\\Administrators:\(F\)') { throw 'Administrators entry missing' }
          if ($acl -notmatch 'NT AUTHORITY\\SYSTEM:\(F\)') { throw 'SYSTEM entry missing' }
          if ($acl -match '\(I\)') { throw 'inherited entries present' }
          $entries = ($acl -split "`n" | Where-Object { $_ -match ':\(' }).Count
          if ($entries -ne 2) { throw "expected exactly 2 ACEs, found $entries" }
      # A second agent on the service's own log directory must be refused with exit code 5,
      # so the service and an interactive copy can never interleave writes in the same logs.
      - name: Second instance on the same log directory is refused
        shell: pwsh
        run: |
          $agent = "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe"
          $dir = Join-Path $env:ProgramData 'FlamingoAgent'
          $err = Join-Path $env:TEMP 'second-instance-stderr.txt'
          $p = Start-Process -FilePath $agent -ArgumentList @('--log-dir', "`"$dir`"", '--period-secs', '30', '--child-timeout-secs', '20') -RedirectStandardError $err -PassThru
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw 'the second instance did not exit' }
          $text = Get-Content -LiteralPath $err -Raw -ErrorAction SilentlyContinue
          Write-Host "exit $($p.ExitCode): $text"
          if ($p.ExitCode -ne 5) { throw "expected exit 5, got $($p.ExitCode)" }
          if ($text -notmatch 'already holds the lock') { throw 'expected the already-running message' }
          $q = sc.exe query FlamingoAgent | Out-String
          if ($q -notmatch 'RUNNING') { throw "the service was disturbed: $q" }
      # Both logs rotate by size and the rotated generations keep the lock: the smallest
      # limit the CLI accepts (1 KiB) forces several agent.log rotations and one child.log
      # rotation (about 59 bytes per cycle, so 18 cycles) in 40 s at a 2 s period, and
      # icacls on a rotated file must show the same two entries as the live one, with
      # nothing inherited.
      - name: Logs rotate by size and rotated files keep the lock
        shell: pwsh
        run: |
          $logs = Join-Path $env:TEMP 'rotation-logs'
          $agent = "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe"
          $p = Start-Process -FilePath $agent -ArgumentList @('--log-dir', "`"$logs`"", '--period-secs', '2', '--child-timeout-secs', '1', '--log-max-bytes', '1024', '--log-keep', '2') -PassThru
          Start-Sleep -Seconds 40
          if ($p.HasExited) { throw "agent exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Get-ChildItem $logs | ForEach-Object { Write-Host ("{0,-14} {1,6} bytes" -f $_.Name, $_.Length) }
          foreach ($name in 'agent.log', 'agent.1.log', 'agent.2.log', 'child.log', 'child.1.log') {
            if (-not (Test-Path (Join-Path $logs $name))) { throw "$name is missing" }
          }
          if (Test-Path (Join-Path $logs 'agent.3.log')) { throw 'agent.3.log exists: keep = 2 was not honoured' }
          foreach ($name in 'agent.1.log', 'child.1.log') {
            $acl = icacls (Join-Path $logs $name) | Out-String
            Write-Host $acl
            if ($acl -match '\(I\)') { throw "$name has inherited entries" }
            if ($acl -notmatch 'BUILTIN\\Administrators:\(F\)' -or $acl -notmatch 'NT AUTHORITY\\SYSTEM:\(F\)') { throw "$name lost the lock" }
            if (([regex]::Matches($acl, ':\(')).Count -ne 2) { throw "$name has more than two entries" }
          }
          if (-not (Select-String -Path (Join-Path $logs 'agent*.log') -Pattern 'child log rotated' -Quiet)) { throw 'no child log rotation was logged' }
      # Checklist row 9: with the child binary gone the service must keep running and log a
      # spawn failure every cycle, then recover once the binary is back. Renaming a running
      # image is allowed on Windows, but the move still retries briefly in case the file is
      # being opened at that instant.
      - name: Missing child binary is survived and recovered from
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramData 'FlamingoAgent'
          $exe = "$env:ProgramFiles\FlamingoAgent\logger-child.exe"
          $moved = "$exe.moved"
          $before = @(Select-String -Path "$dir\agent.log" -Pattern 'child completed').Count
          $ok = $false
          for ($i = 0; $i -lt 10 -and -not $ok; $i++) {
            try { Move-Item -LiteralPath $exe -Destination $moved -ErrorAction Stop; $ok = $true } catch { Start-Sleep -Milliseconds 300 }
          }
          if (-not $ok) { throw 'could not move logger-child.exe away' }
          Start-Sleep -Seconds 12
          $failures = @(Select-String -Path "$dir\agent.log" -Pattern 'child could not be spawned').Count
          $q = sc.exe query FlamingoAgent | Out-String
          Write-Host "spawn failures logged while the child was missing: $failures"
          if ($failures -lt 2) { throw "expected at least 2 logged spawn failures, saw $failures" }
          if ($q -notmatch 'RUNNING') { throw "service not RUNNING while the child was missing: $q" }
          Move-Item -LiteralPath $moved -Destination $exe
          Start-Sleep -Seconds 12
          $after = @(Select-String -Path "$dir\agent.log" -Pattern 'child completed').Count
          Write-Host "child completed: before=$before after=$after"
          if ($after -le $before) { throw 'the service did not recover after the child binary returned' }
          Get-Content "$dir\agent.log" | Select-Object -Last 8
      # Checklist rows 6 and 7: a standard (non-administrator) account must be unable to read,
      # delete or rename child.log. Each operation runs under that account in a credentialed
      # process; a denial is exit 5 with an access-denied message, and the file must be intact
      # afterwards. The account is removed by "Remove the test account" below, which runs even
      # if this step fails.
      - name: Standard user is denied read, delete and rename
        shell: pwsh
        run: |
          $user = 'flamingo_tester'
          $pw = 'Fl4mingo-Tester-2026!'
          net user $user $pw /add /y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'could not create the test account' }
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\$user", (ConvertTo-SecureString $pw -AsPlainText -Force))
          $log = Join-Path $env:ProgramData 'FlamingoAgent\child.log'
          $linesBefore = @(Get-Content -LiteralPath $log).Count
          $ops = @(
            @{ name = 'read';   cmd = "Get-Content -LiteralPath '$log' -ErrorAction Stop | Out-Null" },
            @{ name = 'delete'; cmd = "Remove-Item -LiteralPath '$log' -ErrorAction Stop" },
            @{ name = 'rename'; cmd = "Rename-Item -LiteralPath '$log' -NewName 'x.log' -ErrorAction Stop" }
          )
          foreach ($op in $ops) {
            $out = Join-Path $env:TEMP "standard-user-$($op.name).txt"
            $script = "try { $($op.cmd); exit 0 } catch { Write-Output `$_.Exception.Message; exit 5 }"
            $p = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile', '-NonInteractive', '-Command', $script) -Credential $cred -WorkingDirectory $env:SystemRoot -RedirectStandardOutput $out -Wait -PassThru
            $text = (Get-Content -LiteralPath $out -Raw -ErrorAction SilentlyContinue)
            Write-Host "[$($op.name)] exit $($p.ExitCode): $text"
            if ($p.ExitCode -ne 5) { throw "standard user was not denied on $($op.name) (exit $($p.ExitCode))" }
            if ($text -notmatch 'denied') { throw "expected an access-denied message on $($op.name)" }
          }
          if (-not (Test-Path -LiteralPath $log)) { throw 'child.log is gone after the denied operations' }
          if (@(Get-Content -LiteralPath $log).Count -lt $linesBefore) { throw 'child.log lost lines' }
      # Checklist row 10, decline path. The UAC policy "automatically deny elevation requests"
      # for standard users makes a standard account's elevation attempt fail without any
      # dialog, so launching the agent from that account exercises its own UAC relaunch
      # against the real Application Information service: the request is refused with
      # ERROR_CANCELLED and the agent must exit with code 3. Clicking Accept on a consent
      # dialog cannot be scripted; that remains the one manual item. The policy is restored
      # afterwards even though the runner is discarded.
      - name: UAC elevation request by a standard user is denied
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
          $old = (Get-ItemProperty -Path $key -Name ConsentPromptBehaviorUser -ErrorAction SilentlyContinue).ConsentPromptBehaviorUser
          Set-ItemProperty -Path $key -Name ConsentPromptBehaviorUser -Value 0 -Type DWord
          try {
            $user = 'flamingo_tester'
            $pw = 'Fl4mingo-Tester-2026!'
            $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\$user", (ConvertTo-SecureString $pw -AsPlainText -Force))
            $effective = (Get-ItemProperty -Path $key -Name ConsentPromptBehaviorUser).ConsentPromptBehaviorUser
            Write-Host "ConsentPromptBehaviorUser now: $effective"
            $err = Join-Path $env:TEMP 'uac-denied-stderr.txt'
            $p = Start-Process -FilePath "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe" -ArgumentList @('--log-dir', "$env:TEMP\uac-denied-logs") -Credential $cred -WorkingDirectory $env:SystemRoot -RedirectStandardError $err -PassThru
            # A refused elevation returns within a second. Anything longer means the request is
            # blocked somewhere (a prompt that cannot be answered, or an elevated copy that was
            # unexpectedly allowed to start), so the wait is bounded and the cause is reported.
            if (-not $p.WaitForExit(60000)) {
              Write-Host 'the agent did not exit within 60 s; processes named flamingo-agent:'
              Get-CimInstance Win32_Process -Filter "Name = 'flamingo-agent.exe'" | ForEach-Object {
                $owner = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
                Write-Host ("  pid={0} session={1} user={2}\{3} cmd={4}" -f $_.ProcessId, $_.SessionId, $owner.Domain, $owner.User, $_.CommandLine)
              }
              Write-Host "stderr so far: $(Get-Content -LiteralPath $err -Raw -ErrorAction SilentlyContinue)"
              taskkill /PID $p.Id /T /F | Out-Null
              throw 'the elevation request neither completed nor was refused within 60 s'
            }
            $text = Get-Content -LiteralPath $err -Raw -ErrorAction SilentlyContinue
            Write-Host "exit $($p.ExitCode): $text"
            if ($p.ExitCode -ne 3) { throw "expected exit 3 (elevation refused), got $($p.ExitCode)" }
            if ($text -notmatch 'blocked by policy') { throw 'expected the blocked-by-policy message on stderr' }
          } finally {
            if ($null -eq $old) { Remove-ItemProperty -Path $key -Name ConsentPromptBehaviorUser -ErrorAction SilentlyContinue }
            else { Set-ItemProperty -Path $key -Name ConsentPromptBehaviorUser -Value $old -Type DWord }
          }
      # Pre-planting: under ProgramData any user can create a subdirectory before the service
      # first starts, and a junction needs no privilege at all. The standard account plants a
      # directory it owns and a junction to a system folder; the agent, elevated, must refuse
      # both with exit 1 rather than adopt them.
      - name: Planted log locations are refused
        shell: pwsh
        run: |
          $user = 'flamingo_tester'
          $pw = 'Fl4mingo-Tester-2026!'
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\$user", (ConvertTo-SecureString $pw -AsPlainText -Force))
          $planted = 'C:\Users\Public\planted-logs'
          $link = 'C:\Users\Public\planted-link'
          $plant = Start-Process -FilePath cmd.exe -ArgumentList @('/c', "mkdir `"$planted`" && mklink /J `"$link`" C:\Windows\Temp") -Credential $cred -WorkingDirectory $env:SystemRoot -Wait -PassThru
          if ($plant.ExitCode -ne 0) { throw "planting as the standard user failed with $($plant.ExitCode)" }
          $agent = "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe"
          $cases = @(
            @{ dir = $planted; expect = 'owned by an account other than' },
            @{ dir = $link;    expect = 'reparse point' }
          )
          foreach ($case in $cases) {
            $err = Join-Path $env:TEMP "planted-$([IO.Path]::GetFileName($case.dir)).txt"
            $p = Start-Process -FilePath $agent -ArgumentList @('--log-dir', "`"$($case.dir)`"", '--period-secs', '30', '--child-timeout-secs', '20') -RedirectStandardError $err -PassThru
            if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw "the agent did not exit for $($case.dir)" }
            $text = Get-Content -LiteralPath $err -Raw -ErrorAction SilentlyContinue
            Write-Host "[$($case.dir)] exit $($p.ExitCode): $text"
            if ($p.ExitCode -ne 1) { throw "expected exit 1 for $($case.dir), got $($p.ExitCode)" }
            if ($text -notmatch 'refusing to use it' -or $text -notmatch $case.expect) { throw "expected a refusal mentioning '$($case.expect)' for $($case.dir)" }
          }
          cmd /c rmdir "$link" | Out-Null
          Remove-Item -LiteralPath $planted -Recurse -Force -ErrorAction SilentlyContinue
      - name: Remove the test account
        if: always()
        shell: pwsh
        run: |
          net user flamingo_tester /delete 2>&1 | Out-Null
          exit 0
      # Checklist row 10, elevated path. The runner account already holds an elevated token,
      # so an interactive launch runs without a prompt, exactly as it does after accepting
      # UAC. It uses its own log directory, cycles a few times and is then stopped with a real
      # console Ctrl+C generated by a helper that attaches to the agent's console; the agent
      # must exit with code 0, write its shutdown line and leave no child behind.
      - name: Interactive elevated run stops cleanly on Ctrl+C
        shell: pwsh
        run: |
          $logs = Join-Path $env:TEMP 'interactive-logs'
          $agent = "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe"
          $child = "$env:ProgramFiles\FlamingoAgent\logger-child.exe"
          # Start-Process joins the argument list with spaces and does not quote, and the child
          # lives under "Program Files", so the path arguments are quoted explicitly.
          $p = Start-Process -FilePath $agent -ArgumentList @('--log-dir', "`"$logs`"", '--child-path', "`"$child`"", '--period-secs', '2', '--child-timeout-secs', '1') -PassThru
          Start-Sleep -Seconds 7
          if ($p.HasExited) { throw "agent exited early with $($p.ExitCode)" }
          $sender = @'
          param([int]$TargetPid)
          Add-Type -Namespace CtrlSender -Name Native -MemberDefinition @"
          [DllImport("kernel32.dll", SetLastError = true)] public static extern bool FreeConsole();
          [DllImport("kernel32.dll", SetLastError = true)] public static extern bool AttachConsole(uint pid);
          [DllImport("kernel32.dll", SetLastError = true)] public static extern bool SetConsoleCtrlHandler(IntPtr handler, bool add);
          [DllImport("kernel32.dll", SetLastError = true)] public static extern bool GenerateConsoleCtrlEvent(uint ctrlEvent, uint processGroupId);
          "@
          [CtrlSender.Native]::FreeConsole() | Out-Null
          if (-not [CtrlSender.Native]::AttachConsole([uint32]$TargetPid)) { exit 2 }
          [CtrlSender.Native]::SetConsoleCtrlHandler([IntPtr]::Zero, $true) | Out-Null
          if (-not [CtrlSender.Native]::GenerateConsoleCtrlEvent(0, 0)) { exit 3 }
          Start-Sleep -Seconds 1
          exit 0
          '@
          $senderPath = Join-Path $env:TEMP 'send-ctrl-c.ps1'
          Set-Content -LiteralPath $senderPath -Value $sender
          $s = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $senderPath, '-TargetPid', $p.Id) -Wait -PassThru -WindowStyle Hidden
          if ($s.ExitCode -ne 0) { throw "the Ctrl+C helper failed with $($s.ExitCode)" }
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw 'the agent did not stop within 15 s of Ctrl+C' }
          Write-Host "agent exit code after Ctrl+C: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "expected exit 0 after Ctrl+C, got $($p.ExitCode)" }
          $log = Get-Content -LiteralPath (Join-Path $logs 'agent.log')
          $log | Select-Object -Last 6
          if (@($log | Select-String ' metrics utc=').Count -lt 2) { throw 'fewer than 2 metrics lines in the interactive run' }
          if (-not ($log -match 'flamingo-agent stopped')) { throw 'no clean shutdown line' }
          if (Get-Process logger-child -ErrorAction SilentlyContinue) { throw 'orphan logger-child after the interactive stop' }
      # Process management: a hard kill of the agent (TerminateProcess, which runs no handler
      # and drops nothing) must still take its running child with it. The child here is the
      # sleep fixture, cmd.exe running ping, both of which sit in the agent's job object.
      - name: Hard-killed agent takes its child with it
        shell: pwsh
        run: |
          $logs = Join-Path $env:TEMP 'hard-kill-logs'
          $agent = "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe"
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'agent-rust\tests\fixtures\sleep_10.cmd'
          $p = Start-Process -FilePath $agent -ArgumentList @('--log-dir', "`"$logs`"", '--child-path', "`"$fixture`"", '--period-secs', '30', '--child-timeout-secs', '20') -PassThru
          # The first cycle starts after bootstrap, which on a loaded runner can take a few
          # seconds; poll instead of guessing a fixed delay. The fixture lives 10 s.
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 200
            if ($p.HasExited) { throw "agent exited early with $($p.ExitCode)" }
            $before = @(Get-CimInstance Win32_Process -Filter "Name = 'PING.EXE'" | Where-Object { $_.CommandLine -match '-n 11' })
          } while ($before.Count -lt 1 -and (Get-Date) -lt $deadline)
          Write-Host "fixture ping processes before the kill: $($before.Count)"
          if ($before.Count -lt 1) {
            Get-Content -LiteralPath (Join-Path $logs 'agent.log') -ErrorAction SilentlyContinue
            throw 'the sleep fixture is not running under the agent'
          }
          Stop-Process -Id $p.Id -Force
          $deadline = (Get-Date).AddSeconds(3)
          do {
            Start-Sleep -Milliseconds 200
            $after = @(Get-CimInstance Win32_Process -Filter "Name = 'PING.EXE'" | Where-Object { $_.CommandLine -match '-n 11' })
          } while ($after.Count -gt 0 -and (Get-Date) -lt $deadline)
          Write-Host "fixture ping processes after the kill: $($after.Count)"
          if ($after.Count -gt 0) { throw 'the child outlived the hard-killed agent' }
      # The substance of checklist row 11 (start after a reboot on a clean machine): both
      # binaries must run without the Visual C++ redistributable. Their import tables are
      # read with dumpbin and must name no VC runtime, C++ standard library or Universal CRT
      # DLL. This is a direct check of the static-CRT claim; the reboot itself cannot be done
      # on a hosted runner.
      - name: Binaries are self-contained (no VC++ runtime imports)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw 'dumpbin.exe not found in the Visual Studio installation' }
          foreach ($exe in @("$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe", "$env:ProgramFiles\FlamingoAgent\logger-child.exe")) {
            $deps = & $dumpbin /nologo /dependents $exe | Out-String
            $dlls = @($deps -split "`r?`n" | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() })
            Write-Host "$(Split-Path $exe -Leaf) imports: $($dlls -join ', ')"
            $bad = @($dlls | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt)' })
            if ($bad.Count -gt 0) { throw "$exe depends on the VC++ runtime: $($bad -join ', ')" }
          }
      # A bootstrap failure in service mode has no console to print to: the error must
      # reach the Application event log. The registered command line is swapped for one the
      # config check rejects, the service is started, and then the original is restored.
      - name: Event log records a bootstrap failure
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe"
          Stop-Service FlamingoAgent
          sc.exe config FlamingoAgent binPath= "`"$exe`" --period-secs 5 --child-timeout-secs 5" | Out-Null
          sc.exe start FlamingoAgent | Out-Null
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 500
            $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='FlamingoAgent'; Id=3} -MaxEvents 1 -ErrorAction SilentlyContinue
          } while (-not $ev -and (Get-Date) -lt $deadline)
          $q = sc.exe query FlamingoAgent | Out-String
          Write-Host $q
          if (-not $ev) { throw 'no bootstrap-failure event was recorded' }
          Write-Host "$($ev.TimeCreated) [$($ev.Id)] $($ev.LevelDisplayName): $($ev.Message)"
          if ($ev.LevelDisplayName -ne 'Error') { throw "expected an Error event, got $($ev.LevelDisplayName)" }
          if ($ev.Message -notmatch 'failed to start: .*must be shorter than the period') { throw 'unexpected failure message' }
          if ($q -notmatch 'SERVICE_EXIT_CODE\s*:\s*1') { throw 'the SCM did not record service-specific exit code 1' }
          sc.exe config FlamingoAgent binPath= "`"$exe`"" | Out-Null
          # The recovery policy may already be restarting it; start only if it is stopped.
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $q = sc.exe query FlamingoAgent | Out-String
            if ($q -match 'STOPPED') { sc.exe start FlamingoAgent | Out-Null }
            Start-Sleep -Seconds 1
          } while ($q -notmatch 'RUNNING' -and (Get-Date) -lt $deadline)
          if ($q -notmatch 'RUNNING') { throw "not RUNNING after restoring the command line: $q" }
      - name: Stop cleanly and uninstall
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Stop-Service FlamingoAgent
          Write-Host "stopped in $($sw.ElapsedMilliseconds) ms"
          if ($sw.Elapsed.TotalSeconds -gt 8) { throw 'stop took too long' }
          if (Get-Process logger-child -ErrorAction SilentlyContinue) { throw 'orphan logger-child' }
          $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='FlamingoAgent'; Id=2} -MaxEvents 1
          Write-Host "$($ev.TimeCreated) [$($ev.Id)] $($ev.LevelDisplayName): $($ev.Message)"
          if ($ev.Message -notmatch 'Flamingo Agent stopped on request') { throw 'unexpected stop message' }
          & "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe" --uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall exit $LASTEXITCODE" }
          if (Get-Service FlamingoAgent -ErrorAction SilentlyContinue) { throw 'service still registered' }
          if (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\FlamingoAgent') { throw 'event source registration was not removed' }
      - name: Reinstall is idempotent
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { throw "reinstall exit $LASTEXITCODE" }
          $q = sc.exe query FlamingoAgent | Out-String
          Write-Host $q
          if ($q -notmatch 'RUNNING') { throw "not RUNNING after reinstall: $q" }
          & "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe" --uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall exit $LASTEXITCODE" }
          if (Get-Service FlamingoAgent -ErrorAction SilentlyContinue) { throw 'service still registered' }
      # The service is gone at this point, so this exercises the ERROR_SERVICE_DOES_NOT_EXIST
      # branch of `uninstall` against the real SCM. `Continue` is needed because the agent
      # reports the failure on stderr, which pwsh would otherwise turn into a step error
      # before the exit code and the message can be checked. A non-zero exit is the expected
      # result here, so the code is captured and the script ends with an explicit `exit 0`:
      # GitHub appends `exit $LASTEXITCODE` to every pwsh step, which would otherwise fail
      # the step on the very exit code this test is asserting.
      - name: Uninstall when not installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & "$env:ProgramFiles\FlamingoAgent\flamingo-agent.exe" --uninstall 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "exit $code : $out"
          if ($code -ne 1) { throw "expected exit 1, got $code" }
          if ($out -notmatch 'not installed') { throw "message missing: $out" }
          exit 0
