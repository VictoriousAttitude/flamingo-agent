# cargo-mutants policy for the Windows job (`cargo mutants --config .cargo/mutants-windows.toml`).
# Only the Windows-only sources are mutated here; the portable code is covered by the Linux
# job with .cargo/mutants.toml. Only the library's unit tests run per mutant: they are the
# tests that exercise these files, and the integration tests would multiply the run time
# without killing anything more.

examine_globs = ["src/platform/windows.rs", "src/service/windows.rs", "src/service/eventlog.rs"]
additional_cargo_test_args = ["--lib"]

# Functions that only the end-to-end job exercises (they need the real Service Control
# Manager, a UAC prompt, or an elevated relaunch) are excluded by name; every other mutant
# must be killed by the unit tests.
exclude_re = [
    " in run_dispatcher",
    " in service_main",
    " in run_service",
    " in install",
    " in uninstall",
    " in wait_for_state",
    " in relaunch_privileged",
    "replace run_dispatcher ",
    "replace service_main ",
    "replace run_service ",
    "replace install ",
    "replace uninstall ",
    "replace wait_for_state ",
    "replace relaunch_privileged ",
    # Only an unelevated process can tell a lying is_privileged apart; the end-to-end job
    # runs the agent as a standard user and requires exit 3.
    "replace is_privileged -> Result<bool, PlatformError> with Ok\\(true\\)",
    # Equivalent: defensive double-checks on API contracts (`ok == 0 || ptr.is_null()` and
    # the like); the two sides never differ for a real Win32 call.
    "replace \\|\\| with && in SecurityDescriptor::from_sddl",
    "replace \\|\\| with && in SecurityDescriptor::dacl",
    "replace \\|\\| with && in assert_trusted_existing",
    "replace \\|\\| with && in describe_protection",
    # Equivalent: create_dir_all is idempotent, the guard only saves a call.
    "replace && with \\|\\| in secure_dir",
    # Equivalent: the OR-ed flags share no bits, so ^ produces the same value; and the
    # create handle in secure_file is closed on the next line, so its share mode is
    # unobservable.
    "replace \\| with & in secure_file",
    "replace \\| with \\^ in secure_file",
    "replace \\| with \\^ in apply_dacl",
    "replace \\| with \\^ in running",
    # Unobservable: a skipped LocalFree / DeregisterEventSource is a leak, not a behaviour.
    "replace <impl Drop for SecurityDescriptor>::drop with \\(\\)",
    "replace <impl Drop for EventSource>::drop with \\(\\)",
]
