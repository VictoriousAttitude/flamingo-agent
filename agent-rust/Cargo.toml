[package]
name = "flamingo-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Background agent that samples UTC time and process RSS every 5 seconds and launches a privileged logger child"
publish = false

[lib]
name = "flamingo_agent"
path = "src/lib.rs"

[[bin]]
name = "flamingo-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
memory-stats = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `test-util` enables tokio's paused clock, used by the loop-timing test.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
panic = "unwind"
